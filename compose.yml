services:
  ollama:
    # Pinned, and not to the newest release: releases after 0.24.0 build their
    # CUDA 12 backend with a toolkit that needs NVIDIA driver 550 or newer. On a
    # host still on 535 every 0.30.x up to 0.30.10 aborts at model load with
    # "CUDA error: device kernel image is invalid", and 0.30.11 onwards names the
    # cause and falls back to CPU, roughly 7x slower. The GPU architecture is not
    # the problem: compute 7.0 is still in the CUDA 12 build. Check the host
    # driver with "nvidia-smi" before raising this.
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.24.0}
    volumes:
      - ./ollama/data:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - ${OLLAMA_PORT:-11434}:11434
    environment:
      # Quantized KV cache: reduces VRAM used by the cache ~4x (f16 -> q4_0).
      # Without this, a 131K context on deepseek-r1:32b consumes ~32GB of KV cache,
      # forcing some model layers to run on CPU.
      #
      # How to check if your GPUs have enough VRAM:
      #   1. Total GPU VRAM (e.g. 2x V100 32GB = 64GB)
      #   2. Subtract the model size (see "ollama list", SIZE column)
      #   3. The remainder is available for KV cache
      #   4. After loading, verify with "docker exec ollama ollama ps":
      #      - PROCESSOR column should show "100% GPU" (or close)
      #      - If it shows "XX%/YY% CPU/GPU", VRAM is insufficient: reduce context
      #        in Open WebUI (num_ctx parameter) or use a smaller model
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=32768

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-v0.11.3-cuda}
    container_name: open-webui
    volumes:
      - ./openwebui/rockgpt-open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT:-8585}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      # Optional OpenAI-compatible backend (e.g. an on-premise gateway). Both are
      # empty by default, which keeps Ollama as the only inference backend.
      # Never hardcode the key here: put it in .env, which is gitignored.
      - 'OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-}'
      - 'OPENAI_API_KEYS=${OPENAI_API_KEYS:-}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}'
      - 'GLOBAL_LOG_LEVEL=${GLOBAL_LOG_LEVEL:-INFO}'
      # Open WebUI 0.11 defaults function calling to "native", which attaches the
      # tool list to every request. Models without tool support then fail hard:
      # Ollama answers 400 "does not support tools" and an OpenAI-compatible
      # gateway answers 500, and the chat shows an empty reply. Set this to
      # {"function_calling":"legacy"} in .env to get the prompt-based mode used
      # up to 0.9.x, which works with every model. No default is given here
      # because Compose interpolation cannot express a "}" inside one.
      - 'DEFAULT_MODEL_PARAMS=${DEFAULT_MODEL_PARAMS:-}'
      # Model used for background tasks (chat title, tags, follow-up questions)
      # when the chat itself runs on an external backend. Empty means "reuse the
      # chat model", but 0.11 forwards that as an empty model id, and the gateway
      # rejects it with "Model '' was not found" inside the reply. Name a small
      # local model instead.
      - 'TASK_MODEL_EXTERNAL=${TASK_MODEL_EXTERNAL:-}'
      # False opens the UI directly on the preloaded admin account, with no login
      # prompt. Set it to True on any host reachable beyond localhost.
      #
      # One-way door: once auth is on, the instance accumulates users, and Open
      # WebUI refuses to start with auth disabled and more than one user in the
      # database. Going back is a restore of the data directory, not a flip of
      # this flag.
      - 'WEBUI_AUTH=${WEBUI_AUTH:-False}'
      # Public base URL, as the browser sees it. Behind a reverse proxy this is
      # the proxy's name, not the container's port: Open WebUI uses it to build
      # the OAuth redirect and to scope the session cookie.
      - 'WEBUI_URL=${WEBUI_URL:-}'
      # Keep the local email/password form next to the OAuth button. It is the
      # break-glass door: with SSO as the only way in, an outage of the identity
      # provider locks out the administrators too, and Open WebUI has no password
      # reset to recover with — it has no SMTP support at all.
      - 'ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-True}'
      # Role given to an account created by a first SSO login. "pending" parks it
      # in a waiting screen until an administrator promotes it, and that is the
      # access gate: authentication is open to the whole realm, authorization is
      # not. Set it to "user" to let everyone in automatically.
      - 'DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}'

      # --- OIDC single sign-on -----------------------------------------------
      # The provider is an identity provider only: Open WebUI keeps ownership of
      # roles, so ENABLE_OAUTH_ROLE_MANAGEMENT is deliberately left at its False
      # default. Turning it on would recompute the role from a token claim at
      # every login and silently undo any promotion made in the admin interface.
      # See docs/adr/0002-manage-roles-in-open-webui-keycloak-as-idp-only.md
      #
      # These keys are declared PersistentConfig but exempted from it by
      # ENABLE_OAUTH_PERSISTENT_CONFIG, which defaults to False: they are re-read
      # from the environment at every start and never stored. So .env stays
      # authoritative here, unlike everywhere else. Apply a change by recreating
      # the container with "docker compose up -d" — "restart" reuses the
      # container and does not re-read the environment.
      - 'ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-False}'
      # Lets an SSO login land on an existing local account carrying the same
      # email instead of creating a duplicate. Only safe with a single identity
      # provider that verifies email addresses, which is the case here.
      - 'OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-False}'
      - 'OAUTH_ALLOWED_DOMAINS=${OAUTH_ALLOWED_DOMAINS:-*}'
      - 'OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-}'
      - 'OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}'
      # Never hardcode the secret here: it goes in .env, which is gitignored.
      - 'OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}'
      - 'OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}'
      - 'OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-}'
      - 'OAUTH_SCOPES=${OAUTH_SCOPES:-openid email profile}'
      # Where the provider sends the browser after logout. 0.11 always redirects
      # an OAuth session to the provider's end_session_endpoint — there is no way
      # to keep the logout local — and without this it sends no
      # post_logout_redirect_uri, leaving the user on a provider page. Keycloak
      # answers "Invalid redirect uri" unless the value is also registered on the
      # client, under "Valid post logout redirect URIs".
      - 'WEBUI_AUTH_SIGNOUT_REDIRECT_URL=${WEBUI_AUTH_SIGNOUT_REDIRECT_URL:-}'
      # PKCE is opt-in for the login client: left unset, Open WebUI sends no
      # code_challenge at all. Set it to S256 here *before* making PKCE mandatory
      # on the provider, or the authorization request comes back rejected.
      - 'OAUTH_CODE_CHALLENGE_METHOD=${OAUTH_CODE_CHALLENGE_METHOD:-}'
      # Both default to false, which is right for plain HTTP on localhost and
      # wrong behind an HTTPS proxy. Leave the SameSite policy at its "lax"
      # default: "strict" drops the cookie on the OAuth callback, which arrives
      # as a cross-site top-level navigation, and the login loops silently.
      - 'WEBUI_SESSION_COOKIE_SECURE=${WEBUI_SESSION_COOKIE_SECURE:-False}'
      - 'WEBUI_AUTH_COOKIE_SECURE=${WEBUI_AUTH_COOKIE_SECURE:-False}'
      # Text shown to a "pending" account. The default says nothing about who to
      # ask for approval, so name a contact.
      - 'PENDING_USER_OVERLAY_TITLE=${PENDING_USER_OVERLAY_TITLE:-}'
      - 'PENDING_USER_OVERLAY_CONTENT=${PENDING_USER_OVERLAY_CONTENT:-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
