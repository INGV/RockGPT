services:
  ollama:
    # Pinned, and not to the newest release: Ollama dropped compute 7.0 (Volta)
    # from its CUDA builds after 0.24.0. On a Tesla V100 every 0.30.x up to
    # 0.30.10 aborts at model load with "CUDA error: device kernel image is
    # invalid", and 0.30.11 onwards refuses the GPU outright with "NVIDIA driver
    # too old, required_driver 550 or newer" and silently runs on CPU, roughly
    # 7x slower. Check both before raising this on Volta hardware.
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.24.0}
    volumes:
      - ./ollama/data:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - ${OLLAMA_PORT:-11434}:11434
    environment:
      # Quantized KV cache: reduces VRAM used by the cache ~4x (f16 -> q4_0).
      # Without this, a 131K context on deepseek-r1:32b consumes ~32GB of KV cache,
      # forcing some model layers to run on CPU.
      #
      # How to check if your GPUs have enough VRAM:
      #   1. Total GPU VRAM (e.g. 2x V100 32GB = 64GB)
      #   2. Subtract the model size (see "ollama list", SIZE column)
      #   3. The remainder is available for KV cache
      #   4. After loading, verify with "docker exec ollama ollama ps":
      #      - PROCESSOR column should show "100% GPU" (or close)
      #      - If it shows "XX%/YY% CPU/GPU", VRAM is insufficient: reduce context
      #        in Open WebUI (num_ctx parameter) or use a smaller model
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=32768

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-v0.11.3-cuda}
    container_name: open-webui
    volumes:
      - ./openwebui/rockgpt-open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT:-8585}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      # Optional OpenAI-compatible backend (e.g. an on-premise gateway). Both are
      # empty by default, which keeps Ollama as the only inference backend.
      # Never hardcode the key here: put it in .env, which is gitignored.
      - 'OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-}'
      - 'OPENAI_API_KEYS=${OPENAI_API_KEYS:-}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}'
      - 'GLOBAL_LOG_LEVEL=${GLOBAL_LOG_LEVEL:-INFO}'
      # Open WebUI 0.11 defaults function calling to "native", which attaches the
      # tool list to every request. Models without tool support then fail hard:
      # Ollama answers 400 "does not support tools" and an OpenAI-compatible
      # gateway answers 500, and the chat shows an empty reply. Set this to
      # {"function_calling":"legacy"} in .env to get the prompt-based mode used
      # up to 0.9.x, which works with every model. No default is given here
      # because Compose interpolation cannot express a "}" inside one.
      - 'DEFAULT_MODEL_PARAMS=${DEFAULT_MODEL_PARAMS:-}'
      # Model used for background tasks (chat title, tags, follow-up questions)
      # when the chat itself runs on an external backend. Empty means "reuse the
      # chat model", but 0.11 forwards that as an empty model id, and the gateway
      # rejects it with "Model '' was not found" inside the reply. Name a small
      # local model instead.
      - 'TASK_MODEL_EXTERNAL=${TASK_MODEL_EXTERNAL:-}'
      # False opens the UI directly on the preloaded admin account, with no login
      # prompt. Set it to True on any host reachable beyond localhost.
      - 'WEBUI_AUTH=${WEBUI_AUTH:-False}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
